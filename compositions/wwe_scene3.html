<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WWE Scene 3</title>
  <link rel="stylesheet" href="../node_modules/hyperframes/dist/hyperframes.css">
  <style>
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      margin: 0;
      background: #000;
    }
    .clip {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div data-composition-id="wwe-scene-3" data-width="1080" data-height="1920" data-duration="6" data-fps="30">
    <div class="clip" data-start="0" data-duration="6">
      <iframe src="../openfilm_wwe/shots/shot3.html" data-layout-allow-overflow="true"></iframe>
    </div>
  </div>
  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["wwe-scene-3"] = tl;
  </script>
</body>
</html>
