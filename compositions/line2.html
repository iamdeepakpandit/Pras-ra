<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#040e28; font-family:'Poppins', sans-serif; }
      #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
      .clip { position:absolute; }
      .full-frame { top:0; left:0; width:1080px; height:1920px; }

      #bg-img {
        width:1180px; height:2100px; object-fit:cover; object-position:center; display:block;
        transform-origin:center center;
        margin-left:-50px; margin-top:-90px;
      }
      .grain {
        top:0; left:0; width:1080px; height:1920px;
        background-image:url('../assets/images/lyric/film_grain.png');
        background-repeat:repeat;
        mix-blend-mode:overlay;
        opacity:0.38;
        pointer-events:none;
        z-index:20;
      }
      #flash {
        top:0; left:0; width:1080px; height:1920px;
        background:#ffffff;
        opacity:0;
        pointer-events:none;
        z-index:40;
        mix-blend-mode:overlay;
      }
      .mosaic-layer {
        top:0; left:0; width:1080px; height:1920px;
        display:grid;
        grid-template-columns:repeat(12, 90px);
        grid-template-rows:repeat(20, 96px);
        pointer-events:none;
        z-index:30;
        opacity:0;
      }
      .m-cell { background:#040e28; opacity:0; }

      .word {
        top:50%; left:50%;
        transform:translate(-50%, -50%);
        width:1020px;
        height:240px;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        font-family:'Poppins', sans-serif;
        font-weight:800;
        font-size:155px;
        line-height:1;
        letter-spacing:-0.06em;
        text-transform:lowercase;
        color:#ffffff;
        mix-blend-mode:difference;
        pointer-events:none;
        z-index:50;
        opacity:0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="line2" data-start="0" data-duration="4.52" data-width="1080" data-height="1920">
      <img id="bg-img" class="clip full-frame" src="../assets/images/lyric/plate2_blue_couple.jpg" alt="" width="1180" height="2100" data-start="0" data-duration="4.52" data-track-index="0" />
      <div id="grain-layer" class="clip grain" data-start="0" data-duration="4.52" data-track-index="1"></div>
      <div id="flash" class="clip" data-start="0" data-duration="4.52" data-track-index="2"></div>
      <div id="mosaic" class="clip mosaic-layer" data-start="0" data-duration="4.52" data-track-index="3">
        <div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div>
      </div>

      <!-- Line 2: yeh saaray nashay bekaar teri aankhon ke siwa (4.28s - 8.80s, local 0.00 - 4.52s) -->
      <div id="w-yeh" class="clip word" data-start="0.00" data-duration="0.32" data-track-index="4">yeh</div>
      <div id="w-saaray" class="clip word" data-start="0.32" data-duration="0.52" data-track-index="5">saaray</div>
      <div id="w-nashay" class="clip word" data-start="0.84" data-duration="0.68" data-track-index="6">nashay</div>
      <div id="w-bekaar" class="clip word" data-start="1.52" data-duration="1.06" data-track-index="7">bekaar</div>
      <div id="w-teri" class="clip word" data-start="2.58" data-duration="0.64" data-track-index="8">teri</div>
      <div id="w-aankhon" class="clip word" data-start="3.22" data-duration="0.50" data-track-index="9">aankhon</div>
      <div id="w-ke" class="clip word" data-start="3.72" data-duration="0.26" data-track-index="10">ke</div>
      <div id="w-siwa" class="clip word" data-start="3.98" data-duration="0.54" data-track-index="11">siwa</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Ken Burns: slow pan left + zoom in, drifting between silhouettes
      tl.fromTo('#bg-img',
        { scale:1.0, x:0, y:0 },
        { scale:1.07, x:25, y:-12, duration:4.52, ease:'power1.inOut' }, 0);

      // Flashes
      tl.fromTo('#flash', { opacity:0.9 }, { opacity:0, duration:0.12, ease:'power2.out' }, 0.0);
      tl.fromTo('#flash', { opacity:0.9 }, { opacity:0, duration:0.12, ease:'power2.out', immediateRender:false }, 1.52);

      // Words
      tl.fromTo('#w-yeh', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.05 }, 0.00);
      tl.to('#w-yeh', { opacity:0, scale:1.03, duration:0.04 }, 0.28);

      tl.fromTo('#w-saaray', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.05 }, 0.32);
      tl.to('#w-saaray', { opacity:0, scale:1.03, duration:0.04 }, 0.80);

      tl.fromTo('#w-nashay', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.06 }, 0.84);
      tl.to('#w-nashay', { opacity:0, scale:1.03, duration:0.05 }, 1.47);

      tl.fromTo('#w-bekaar', { opacity:0, scale:0.88 }, { opacity:1, scale:1, duration:0.08 }, 1.52);
      tl.to('#w-bekaar', { opacity:0, scale:1.04, duration:0.06 }, 2.52);

      tl.fromTo('#w-teri', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.06 }, 2.58);
      tl.to('#w-teri', { opacity:0, scale:1.03, duration:0.05 }, 3.17);

      tl.fromTo('#w-aankhon', { opacity:0, scale:0.90 }, { opacity:1, scale:1, duration:0.06 }, 3.22);
      tl.to('#w-aankhon', { opacity:0, scale:1.03, duration:0.05 }, 3.68);

      tl.fromTo('#w-ke', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.04 }, 3.72);
      tl.to('#w-ke', { opacity:0, scale:1.03, duration:0.04 }, 3.94);

      tl.fromTo('#w-siwa', { opacity:0, scale:0.88 }, { opacity:1, scale:1, duration:0.08 }, 3.98);
      tl.to('#w-siwa', { opacity:0, scale:1.04, duration:0.06 }, 4.35);

      // Pixel mosaic dissolve to wine red (4.28s - 4.52s)
      tl.fromTo('#mosaic', { opacity:0 }, { opacity:0.95, duration:0.12, ease:'steps(4)' }, 4.28);
      tl.to('#mosaic', { opacity:0, duration:0.12, ease:'steps(4)' }, 4.40);

      window.__timelines['line2'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
