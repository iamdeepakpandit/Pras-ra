<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#020817; font-family:'Poppins', sans-serif; }
      #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
      .clip { position:absolute; }
      .full-frame { top:0; left:0; width:1080px; height:1920px; }

      #bg-img {
        width:1180px; height:2100px; object-fit:cover; object-position:center; display:block;
        transform-origin:center center;
        margin-left:-50px; margin-top:-90px;
      }

      /* Film grain texture */
      .grain {
        top:0; left:0; width:1080px; height:1920px;
        background-image:url('../assets/images/lyric/film_grain.png');
        background-repeat:repeat;
        mix-blend-mode:overlay;
        opacity:0.38;
        pointer-events:none;
        z-index:20;
      }

      /* Flash frame overlay */
      #flash {
        top:0; left:0; width:1080px; height:1920px;
        background:#ffffff;
        opacity:0;
        pointer-events:none;
        z-index:40;
        mix-blend-mode:overlay;
      }

      /* Mosaic dissolve overlay */
      .mosaic-layer {
        top:0; left:0; width:1080px; height:1920px;
        display:grid;
        grid-template-columns:repeat(12, 90px);
        grid-template-rows:repeat(20, 96px);
        pointer-events:none;
        z-index:30;
        opacity:0;
      }
      .m-cell {
        background:#020817;
        opacity:0;
      }

      /* One lowercase word in center, bold Poppins ExtraBold, tight letter spacing, difference blend */
      .word {
        top:50%; left:50%;
        transform:translate(-50%, -50%);
        width:1020px;
        height:240px;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        font-family:'Poppins', sans-serif;
        font-weight:800;
        font-size:155px;
        line-height:1;
        letter-spacing:-0.06em;
        text-transform:lowercase;
        color:#ffffff;
        mix-blend-mode:difference;
        pointer-events:none;
        z-index:50;
        opacity:0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="line1" data-start="0" data-duration="4.28" data-width="1080" data-height="1920">
      <img id="bg-img" class="clip full-frame" src="../assets/images/lyric/plate1_blue_window.jpg" alt="" width="1180" height="2100" data-start="0" data-duration="4.28" data-track-index="0" />
      <div id="grain-layer" class="clip grain" data-start="0" data-duration="4.28" data-track-index="1"></div>
      <div id="flash" class="clip" data-start="0" data-duration="4.28" data-track-index="2"></div>
      <div id="mosaic" class="clip mosaic-layer" data-start="0" data-duration="4.28" data-track-index="3">
        <div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div>
        <div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div>
      </div>

      <!-- Line 1: pal-pal jeena muhaal mera tere bina -->
      <div id="w-palpal" class="clip word" data-start="0.00" data-duration="0.70" data-track-index="4">pal-pal</div>
      <div id="w-jeena" class="clip word" data-start="0.70" data-duration="0.48" data-track-index="5">jeena</div>
      <div id="w-muhaal" class="clip word" data-start="1.18" data-duration="1.00" data-track-index="6">muhaal</div>
      <div id="w-mera" class="clip word" data-start="2.18" data-duration="0.54" data-track-index="7">mera</div>
      <div id="w-tere" class="clip word" data-start="2.72" data-duration="0.74" data-track-index="8">tere</div>
      <div id="w-bina" class="clip word" data-start="3.46" data-duration="0.82" data-track-index="9">bina</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Ken Burns: slow drift right + gentle zoom in, feeling of gazing through rain
      tl.fromTo('#bg-img',
        { scale:1.0, x:0, y:0 },
        { scale:1.08, x:-30, y:-15, duration:4.28, ease:'power1.inOut' }, 0);

      // Flash frames on strong beats
      tl.fromTo('#flash', { opacity:0.95 }, { opacity:0, duration:0.12, ease:'power2.out' }, 0.0);
      tl.fromTo('#flash', { opacity:0.9 }, { opacity:0, duration:0.12, ease:'power2.out', immediateRender:false }, 1.18);
      tl.fromTo('#flash', { opacity:0.9 }, { opacity:0, duration:0.12, ease:'power2.out', immediateRender:false }, 3.46);

      // Word appearances
      tl.fromTo('#w-palpal', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.06 }, 0.00);
      tl.to('#w-palpal', { opacity:0, scale:1.03, duration:0.05 }, 0.65);

      tl.fromTo('#w-jeena', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.06 }, 0.70);
      tl.to('#w-jeena', { opacity:0, scale:1.03, duration:0.05 }, 1.13);

      tl.fromTo('#w-muhaal', { opacity:0, scale:0.88 }, { opacity:1, scale:1, duration:0.08 }, 1.18);
      tl.to('#w-muhaal', { opacity:0, scale:1.04, duration:0.06 }, 2.12);

      tl.fromTo('#w-mera', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.06 }, 2.18);
      tl.to('#w-mera', { opacity:0, scale:1.03, duration:0.05 }, 2.67);

      tl.fromTo('#w-tere', { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.06 }, 2.72);
      tl.to('#w-tere', { opacity:0, scale:1.03, duration:0.05 }, 3.41);

      tl.fromTo('#w-bina', { opacity:0, scale:0.88 }, { opacity:1, scale:1, duration:0.08 }, 3.46);
      tl.to('#w-bina', { opacity:0, scale:1.05, duration:0.06 }, 4.10);

      // Pixel mosaic dissolve at line transition (4.05s - 4.28s)
      tl.fromTo('#mosaic', { opacity:0 }, { opacity:0.9, duration:0.12, ease:'steps(4)' }, 4.05);
      tl.to('#mosaic', { opacity:0, duration:0.11, ease:'steps(4)' }, 4.17);

      window.__timelines['line1'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
