<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Shot 2: चमकता जादुई संदूक</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #04030a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 130px 60px 170px 60px;
      z-index: 10;
    }
    .badge-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tag-badge {
      align-self: flex-start;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.7);
      color: #fbbf24;
      padding: 10px 26px;
      border-radius: 999px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.4);
    }
    .scene-title {
      color: #ffffff;
      font-size: 46px;
      font-weight: 900;
      text-shadow: 0 4px 20px rgba(0,0,0,0.95);
    }
    .subtitle-box {
      background: linear-gradient(180deg, rgba(10,8,22,0.8) 0%, rgba(10,8,22,0.98) 100%);
      border: 1px solid rgba(255,255,255,0.15);
      border-left: 6px solid #fbbf24;
      padding: 24px 34px;
      border-radius: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.85);
    }
    .subtitle-text {
      color: #f8fafc;
      font-size: 36px;
      line-height: 1.45;
      font-weight: 700;
    }
    .fairy-dust {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      pointer-events: none;
      background-image: radial-gradient(#fbbf24 1px, transparent 1px);
      background-size: 5px 5px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="fairy-dust"></div>
  <div class="overlay">
    <div class="badge-wrap">
      <div class="tag-badge">*छिपा हुआ खजाना*</div>
      <div class="scene-title">चमकता जादुई संदूक</div>
    </div>
    <div class="subtitle-box">
      <p class="subtitle-text">आरव ने पुराने बरगद की जड़ों में छिपा एक चमकता हुआ जादुई संदूक देखा।</p>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    
function drawFrame(t) {
  ctx.fillStyle = '#060410';
  ctx.fillRect(0, 0, 1080, 1920);

  // Volumetric beam from above pointing to the chest
  ctx.save();
  ctx.translate(540, 300);
  const beam = ctx.createLinearGradient(0, 0, 0, 1200);
  beam.addColorStop(0, 'rgba(251, 191, 36, 0.35)');
  beam.addColorStop(0.6, 'rgba(251, 191, 36, 0.08)');
  beam.addColorStop(1, 'rgba(6, 4, 16, 0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-380, 1200);
  ctx.lineTo(380, 1200);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Twisted roots wrapping around the chest
  ctx.fillStyle = '#0e081e';
  ctx.beginPath();
  ctx.moveTo(100, 1600);
  ctx.bezierCurveTo(240, 1300, 320, 1100, 380, 1050);
  ctx.lineTo(440, 1120);
  ctx.bezierCurveTo(360, 1220, 260, 1450, 180, 1680);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(980, 1600);
  ctx.bezierCurveTo(840, 1300, 760, 1100, 700, 1050);
  ctx.lineTo(640, 1120);
  ctx.bezierCurveTo(720, 1220, 820, 1450, 900, 1680);
  ctx.fill();

  // The Antique Golden Chest
  ctx.save();
  ctx.translate(540, 1050);
  ctx.scale(1.0 + Math.sin(t * 1.5) * 0.02, 1.0 + Math.sin(t * 1.5) * 0.02);

  // Chest Base Body (Dark rich teakwood + gold trims)
  ctx.fillStyle = '#451a03';
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 8;
  ctx.fillRect(-260, -60, 520, 240);
  ctx.strokeRect(-260, -60, 520, 240);

  // Chest Arched Lid
  ctx.beginPath();
  ctx.arc(0, -60, 260, Math.PI, 0, false);
  ctx.fillStyle = '#78350f';
  ctx.fill();
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 10;
  ctx.stroke();

  // Gold Straps and Rivets
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(-180, -180, 40, 360);
  ctx.fillRect(140, -180, 40, 360);

  // Glowing magical keyhole in center
  const keyPulse = 16 + 8 * Math.sin(t * 6);
  ctx.beginPath();
  ctx.arc(0, 30, keyPulse, 0, Math.PI * 2);
  ctx.fillStyle = '#fef08a';
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 50;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-10, 30);
  ctx.lineTo(10, 30);
  ctx.lineTo(16, 75);
  ctx.lineTo(-16, 75);
  ctx.closePath();
  ctx.fillStyle = '#f59e0b';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Floating golden stardust particles rising from chest
  for (let p = 0; p < 25; p++) {
    const py = 1200 - ((t * 260 + p * 38) % 600);
    const px = 540 + Math.sin(p * 5 + t * 2) * 220;
    ctx.beginPath();
    ctx.arc(px, py, 3 + Math.sin(t * 4 + p) * 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fef08a';
    ctx.shadowColor = '#fbbf24';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}


    window.film = {
      frame(t) {
        drawFrame(t);
      }
    };

    window.film.frame(0);
  </script>
</body>
</html>
