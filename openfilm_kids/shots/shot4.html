<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Shot 4: चाबी घूमी...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #04030a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 130px 60px 170px 60px;
      z-index: 10;
    }
    .badge-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tag-badge {
      align-self: flex-start;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.7);
      color: #fbbf24;
      padding: 10px 26px;
      border-radius: 999px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.4);
    }
    .scene-title {
      color: #ffffff;
      font-size: 46px;
      font-weight: 900;
      text-shadow: 0 4px 20px rgba(0,0,0,0.95);
    }
    .subtitle-box {
      background: linear-gradient(180deg, rgba(10,8,22,0.8) 0%, rgba(10,8,22,0.98) 100%);
      border: 1px solid rgba(255,255,255,0.15);
      border-left: 6px solid #fbbf24;
      padding: 24px 34px;
      border-radius: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.85);
    }
    .subtitle-text {
      color: #f8fafc;
      font-size: 36px;
      line-height: 1.45;
      font-weight: 700;
    }
    .fairy-dust {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      pointer-events: none;
      background-image: radial-gradient(#fbbf24 1px, transparent 1px);
      background-size: 5px 5px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="fairy-dust"></div>
  <div class="overlay">
    <div class="badge-wrap">
      <div class="tag-badge">*सस्पेंस का चरम*</div>
      <div class="scene-title">चाबी घूमी...</div>
    </div>
    <div class="subtitle-box">
      <p class="subtitle-text">लेकिन आरव रुका नहीं... और संदूक का ताला धीरे से खुल गया!</p>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    
function drawFrame(t) {
  ctx.fillStyle = '#06030c';
  ctx.fillRect(0, 0, 1080, 1920);

  // Intense focal spotlight on the antique keyhole
  const spot = ctx.createRadialGradient(540, 920, 60, 540, 920, 500);
  spot.addColorStop(0, 'rgba(251, 191, 36, 0.35)');
  spot.addColorStop(0.7, 'rgba(147, 51, 234, 0.1)');
  spot.addColorStop(1, 'rgba(6, 3, 12, 0)');
  ctx.fillStyle = spot;
  ctx.fillRect(0, 0, 1080, 1920);

  // Giant Antique Keyhole Plate (Close-up Macro)
  ctx.save();
  ctx.translate(540, 920);

  // Heavy sculpted brass plate
  ctx.fillStyle = '#78350f';
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(0, 0, 320, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Inner lock chamber
  ctx.beginPath();
  ctx.arc(0, -30, 70, 0, Math.PI * 2);
  ctx.fillStyle = '#020105';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-35, -30);
  ctx.lineTo(35, -30);
  ctx.lineTo(50, 120);
  ctx.lineTo(-50, 120);
  ctx.closePath();
  ctx.fill();

  // The Golden Antique Key turning smoothly
  // At t=2.0s the key rotates 90 degrees ("CLICK!")
  const keyRot = (t < 2.0) ? (t / 2.0) * 0.4 : 0.4 + Math.min(1.57, (t - 2.0) * 3.0);
  ctx.save();
  ctx.rotate(keyRot);

  // Key handle & shaft
  ctx.strokeStyle = '#fef08a';
  ctx.lineWidth = 22;
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 40;
  ctx.beginPath();
  ctx.arc(0, -180, 55, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -125);
  ctx.lineTo(0, 40);
  ctx.stroke();

  // Key teeth
  ctx.beginPath();
  ctx.moveTo(0, 10);
  ctx.lineTo(35, 10);
  ctx.moveTo(0, 35);
  ctx.lineTo(45, 35);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Expanding "CLICK!" shockwave ring after t=2.5s
  if (t > 2.5) {
    const clickAge = t - 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, clickAge * 450, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(254, 240, 138, ' + Math.max(0, 1 - clickAge * 0.7) + ')';
    ctx.lineWidth = 8;
    ctx.stroke();

    // Radiant light rays breaking through
    for (let ray = 0; ray < 12; ray++) {
      const rayAngle = ray * (Math.PI / 6) + t;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(rayAngle) * 550, Math.sin(rayAngle) * 550);
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
      ctx.lineWidth = 4;
      ctx.stroke();
    }
  }

  ctx.restore();

  // Sound Effect Text
  if (t > 2.2 && t < 4.5) {
    ctx.save();
    ctx.translate(540, 1420);
    ctx.fillStyle = '#fbbf24';
    ctx.font = '900 68px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#f59e0b';
    ctx.shadowBlur = 30;
    ctx.fillText('* CLICK! *', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
}


    window.film = {
      frame(t) {
        drawFrame(t);
      }
    };

    window.film.frame(0);
  </script>
</body>
</html>
