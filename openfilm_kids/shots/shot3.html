<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Shot 3: हवा की फुसफुसाहट</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #04030a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 130px 60px 170px 60px;
      z-index: 10;
    }
    .badge-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tag-badge {
      align-self: flex-start;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.7);
      color: #fbbf24;
      padding: 10px 26px;
      border-radius: 999px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.4);
    }
    .scene-title {
      color: #ffffff;
      font-size: 46px;
      font-weight: 900;
      text-shadow: 0 4px 20px rgba(0,0,0,0.95);
    }
    .subtitle-box {
      background: linear-gradient(180deg, rgba(10,8,22,0.8) 0%, rgba(10,8,22,0.98) 100%);
      border: 1px solid rgba(255,255,255,0.15);
      border-left: 6px solid #fbbf24;
      padding: 24px 34px;
      border-radius: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.85);
    }
    .subtitle-text {
      color: #f8fafc;
      font-size: 36px;
      line-height: 1.45;
      font-weight: 700;
    }
    .fairy-dust {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      pointer-events: none;
      background-image: radial-gradient(#fbbf24 1px, transparent 1px);
      background-size: 5px 5px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="fairy-dust"></div>
  <div class="overlay">
    <div class="badge-wrap">
      <div class="tag-badge">*चेतावनी*</div>
      <div class="scene-title">हवा की फुसफुसाहट</div>
    </div>
    <div class="subtitle-box">
      <p class="subtitle-text">तभी हवा में फुसफुसाहट गूंजी—‘इसे कभी मत खोलना!’</p>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    
function drawFrame(t) {
  ctx.fillStyle = '#050209';
  ctx.fillRect(0, 0, 1080, 1920);

  // Swirling dark violet & crimson wind vortex
  ctx.save();
  ctx.translate(540, 960);
  const vortexAngle = t * 1.8;
  ctx.rotate(vortexAngle);

  for (let arm = 0; arm < 4; arm++) {
    ctx.beginPath();
    ctx.arc(0, 0, 360, arm * 0.5 * Math.PI, (arm * 0.5 + 0.3) * Math.PI);
    ctx.strokeStyle = 'rgba(239, 68, 68, ' + (0.35 + 0.25 * Math.sin(t * 4 + arm)) + ')';
    ctx.lineWidth = 14;
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 30;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();

  // Swirling autumn warning leaves
  for (let l = 0; l < 30; l++) {
    const angle = t * 2 + l * 0.4;
    const dist = 180 + (l * 20) % 350;
    const lx = 540 + Math.cos(angle) * dist;
    const ly = 960 + Math.sin(angle) * (dist * 1.3);

    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(angle * 2);
    ctx.fillStyle = (l % 2 === 0) ? '#dc2626' : '#a855f7';
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Whispering Spirit Eyes in dark shadows above
  const eyeAlpha = 0.4 + 0.5 * Math.sin(t * 5);
  ctx.save();
  ctx.translate(540, 620);
  // Left eye
  ctx.beginPath();
  ctx.ellipse(-140, 0, 45, 20, -0.15, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(192, 132, 252, ' + eyeAlpha + ')';
  ctx.shadowColor = '#c084fc';
  ctx.shadowBlur = 35;
  ctx.fill();
  // Right eye
  ctx.beginPath();
  ctx.ellipse(140, 0, 45, 20, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // Warning text banner in Hindi
  ctx.save();
  ctx.translate(540, 1340);
  ctx.fillStyle = 'rgba(20, 8, 28, 0.9)';
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 4;
  ctx.fillRect(-380, -60, 760, 120);
  ctx.strokeRect(-380, -60, 760, 120);

  ctx.fillStyle = '#f87171';
  ctx.font = '900 48px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('‘इसे कभी मत खोलना!’', 0, 16);
  ctx.restore();
}


    window.film = {
      frame(t) {
        drawFrame(t);
      }
    };

    window.film.frame(0);
  </script>
</body>
</html>
