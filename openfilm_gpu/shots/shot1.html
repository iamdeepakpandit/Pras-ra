<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Shot 1: 3 MILLION VS 80 BILLION</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #020306;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 130px 60px 170px 60px;
      z-index: 10;
    }
    .badge-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tag-badge {
      align-self: flex-start;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.6);
      color: #22d3ee;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
    }
    .scene-title {
      color: #ffffff;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }
    .subtitle-box {
      background: linear-gradient(180deg, rgba(3,7,18,0.75) 0%, rgba(3,7,18,0.96) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-left: 6px solid #22d3ee;
      padding: 24px 32px;
      border-radius: 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.8);
    }
    .subtitle-text {
      color: #f8fafc;
      font-size: 34px;
      line-height: 1.4;
      font-weight: 600;
    }
    .film-grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 4px 4px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="film-grain"></div>
  <div class="overlay">
    <div class="badge-wrap">
      <div class="tag-badge">*THE IMPOSSIBLE SCALE*</div>
      <div class="scene-title">3 MILLION VS 80 BILLION</div>
    </div>
    <div class="subtitle-box">
      <p class="subtitle-text">A commercial jet has three million parts. But a single AI chip has over eighty billion components.</p>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    
function drawFrame(t) {
  ctx.fillStyle = '#03050a';
  ctx.fillRect(0, 0, 1080, 1920);

  // Background tech grid
  ctx.strokeStyle = 'rgba(6, 182, 212, 0.07)';
  ctx.lineWidth = 1;
  for (let x = 0; x < 1080; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1920); ctx.stroke();
  }
  for (let y = 0; y < 1920; y += 60) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1080, y); ctx.stroke();
  }

  // Top Card: Airplane Blueprint (3 Million Parts)
  ctx.save();
  ctx.translate(540, 560);
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(-460, -180, 920, 360);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
  ctx.fillRect(-460, -180, 920, 360);

  // Airplane schematic silhouette
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 4;
  ctx.beginPath();
  // Fuselage
  ctx.moveTo(0, -120);
  ctx.lineTo(30, 80);
  ctx.lineTo(80, 100);
  ctx.lineTo(0, 90);
  ctx.lineTo(-80, 100);
  ctx.lineTo(-30, 80);
  ctx.closePath();
  ctx.stroke();
  // Wings
  ctx.beginPath();
  ctx.moveTo(0, -30);
  ctx.lineTo(240, 40);
  ctx.lineTo(220, 60);
  ctx.lineTo(0, 20);
  ctx.lineTo(-220, 60);
  ctx.lineTo(-240, 40);
  ctx.closePath();
  ctx.stroke();

  // Airplane stats
  ctx.fillStyle = '#94a3b8';
  ctx.font = '700 24px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SYSTEM: COMMERCIAL JETLINER (BOEING 787)', -420, -135);
  ctx.fillStyle = '#38bdf8';
  ctx.font = '900 48px sans-serif';
  ctx.fillText('3,000,000 PARTS', -420, 140);
  ctx.restore();

  // VS Divider with electric pulse
  ctx.save();
  ctx.translate(540, 890);
  ctx.fillStyle = '#f59e0b';
  ctx.font = '900 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('VS', 0, 10);
  ctx.beginPath();
  ctx.arc(0, 0, 40 + Math.sin(t * 6) * 6, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();

  // Bottom Card: Silicon Microprocessor (80 Billion Transistors)
  ctx.save();
  ctx.translate(540, 1220);
  ctx.strokeStyle = 'rgba(245, 158, 11, 0.4)';
  ctx.lineWidth = 3;
  ctx.strokeRect(-460, -180, 920, 360);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.fillRect(-460, -180, 920, 360);

  // Microscopic silicon matrix grid
  const cols = 12;
  const rows = 5;
  const startX = -320;
  const startY = -80;
  for (let c = 0; c < cols; c++) {
    for (let r = 0; r < rows; r++) {
      const px = startX + c * 55;
      const py = startY + r * 30;
      const lit = (Math.sin(t * 5 + c * 0.5 + r * 0.8) > 0);
      ctx.fillStyle = lit ? '#fbbf24' : 'rgba(245, 158, 11, 0.2)';
      ctx.fillRect(px, py, 45, 20);
    }
  }

  ctx.fillStyle = '#94a3b8';
  ctx.font = '700 24px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SYSTEM: MODERN AI PROCESSOR DIE (H100/B200)', -420, -135);
  ctx.fillStyle = '#f59e0b';
  ctx.font = '900 48px sans-serif';
  ctx.fillText('80,000,000,000+ TRANSISTORS', -420, 140);
  ctx.restore();
}


    window.film = {
      frame(t) {
        drawFrame(t);
      }
    };

    window.film.frame(0);
  </script>
</body>
</html>
