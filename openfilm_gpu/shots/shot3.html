<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Shot 3: THE EUV LASER CRUCIBLE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #020306;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 130px 60px 170px 60px;
      z-index: 10;
    }
    .badge-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tag-badge {
      align-self: flex-start;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.6);
      color: #22d3ee;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
    }
    .scene-title {
      color: #ffffff;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }
    .subtitle-box {
      background: linear-gradient(180deg, rgba(3,7,18,0.75) 0%, rgba(3,7,18,0.96) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-left: 6px solid #22d3ee;
      padding: 24px 32px;
      border-radius: 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.8);
    }
    .subtitle-text {
      color: #f8fafc;
      font-size: 34px;
      line-height: 1.4;
      font-weight: 600;
    }
    .film-grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 4px 4px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="film-grain"></div>
  <div class="overlay">
    <div class="badge-wrap">
      <div class="tag-badge">*EXTREME ULTRAVIOLET*</div>
      <div class="scene-title">THE EUV LASER CRUCIBLE</div>
    </div>
    <div class="subtitle-box">
      <p class="subtitle-text">To print them, lasers vaporize molten tin fifty thousand times a second, creating EUV light.</p>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    
function drawFrame(t) {
  ctx.fillStyle = '#050203';
  ctx.fillRect(0, 0, 1080, 1920);

  // Laser chamber grid & vacuum shroud
  ctx.strokeStyle = 'rgba(239, 68, 68, 0.1)';
  ctx.lineWidth = 1;
  for (let y = 300; y < 1600; y += 80) {
    ctx.beginPath(); ctx.moveTo(80, y); ctx.lineTo(1000, y); ctx.stroke();
  }

  // Droplet Generator (Molten Tin Falling)
  const dropY = 400 + ((t * 900) % 550);
  ctx.save();
  ctx.translate(540, dropY);
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fillStyle = '#cbd5e1';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // High-Power CO2 Laser Pulse impacting the droplet
  const isPulse = (Math.sin(t * 18) > 0.4);
  if (isPulse) {
    // Laser beam from left
    ctx.beginPath();
    ctx.moveTo(0, dropY);
    ctx.lineTo(540, dropY);
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 18;
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 40;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Laser beam from right
    ctx.beginPath();
    ctx.moveTo(1080, dropY);
    ctx.lineTo(540, dropY);
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 18;
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 40;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // EUV Plasma Flare (13.5nm extreme ultraviolet)
    ctx.beginPath();
    ctx.arc(540, dropY, 90, 0, Math.PI * 2);
    const flare = ctx.createRadialGradient(540, dropY, 10, 540, dropY, 90);
    flare.addColorStop(0, '#ffffff');
    flare.addColorStop(0.3, '#38bdf8');
    flare.addColorStop(0.7, '#818cf8');
    flare.addColorStop(1, 'rgba(99, 102, 241, 0)');
    ctx.fillStyle = flare;
    ctx.fill();
  }

  // Carl Zeiss Collector Mirror Schematic
  ctx.save();
  ctx.translate(540, 1260);
  ctx.beginPath();
  ctx.arc(0, 0, 320, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 12;
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 30;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Reflected 13.5nm EUV Rays downward onto wafer
  for (let r = -240; r <= 240; r += 60) {
    ctx.beginPath();
    ctx.moveTo(r, 60);
    ctx.lineTo(r * 0.4, 260);
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  ctx.restore();

  // Tech Specs Overlay Box
  ctx.save();
  ctx.translate(540, 1100);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2;
  ctx.fillRect(-380, -70, 760, 140);
  ctx.strokeRect(-380, -70, 760, 140);

  ctx.fillStyle = '#38bdf8';
  ctx.font = '900 42px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('50,000 LASER BLASTS / SEC', 0, -10);

  ctx.fillStyle = '#e2e8f0';
  ctx.font = '700 24px sans-serif';
  ctx.fillText('EXTREME ULTRAVIOLET (13.5nm WAVELENGTH)', 0, 36);
  ctx.restore();
}


    window.film = {
      frame(t) {
        drawFrame(t);
      }
    };

    window.film.frame(0);
  </script>
</body>
</html>
