<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Shot 4: 10,000x SURGICAL STERILITY</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #020306;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 130px 60px 170px 60px;
      z-index: 10;
    }
    .badge-wrap {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tag-badge {
      align-self: flex-start;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.6);
      color: #22d3ee;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
    }
    .scene-title {
      color: #ffffff;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }
    .subtitle-box {
      background: linear-gradient(180deg, rgba(3,7,18,0.75) 0%, rgba(3,7,18,0.96) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-left: 6px solid #22d3ee;
      padding: 24px 32px;
      border-radius: 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.8);
    }
    .subtitle-text {
      color: #f8fafc;
      font-size: 34px;
      line-height: 1.4;
      font-weight: 600;
    }
    .film-grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 4px 4px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="film-grain"></div>
  <div class="overlay">
    <div class="badge-wrap">
      <div class="tag-badge">*ZERO MARGIN OF ERROR*</div>
      <div class="scene-title">10,000x SURGICAL STERILITY</div>
    </div>
    <div class="subtitle-box">
      <p class="subtitle-text">One speck of dust ruins the entire wafer. Cleanrooms must be ten thousand times cleaner than surgical wards.</p>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    
function drawFrame(t) {
  ctx.fillStyle = '#05070a';
  ctx.fillRect(0, 0, 1080, 1920);

  // Sterile Yellow Photolithography Safelight Ambient
  const amberGrad = ctx.createLinearGradient(0, 0, 0, 1920);
  amberGrad.addColorStop(0, 'rgba(245, 158, 11, 0.18)');
  amberGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.05)');
  amberGrad.addColorStop(1, 'rgba(2, 6, 23, 0.95)');
  ctx.fillStyle = amberGrad;
  ctx.fillRect(0, 0, 1080, 1920);

  // Rotating 300mm Silicon Wafer
  ctx.save();
  ctx.translate(540, 780);
  const rot = t * 0.15;
  ctx.rotate(rot);

  // Wafer disc
  ctx.beginPath();
  ctx.arc(0, 0, 300, 0, Math.PI * 2);
  const waferGrad = ctx.createRadialGradient(0, 0, 50, 0, 0, 300);
  waferGrad.addColorStop(0, '#334155');
  waferGrad.addColorStop(0.5, '#1e293b');
  waferGrad.addColorStop(0.9, '#0f172a');
  waferGrad.addColorStop(1, '#e2e8f0');
  ctx.fillStyle = waferGrad;
  ctx.fill();

  // Iridescent holographic diffraction lines on wafer
  for (let d = -260; d <= 260; d += 40) {
    ctx.beginPath();
    ctx.moveTo(d, -260);
    ctx.lineTo(d, 260);
    const rainbow = ctx.createLinearGradient(d, -260, d, 260);
    rainbow.addColorStop(0, 'rgba(6, 182, 212, 0.25)');
    rainbow.addColorStop(0.5, 'rgba(236, 72, 153, 0.25)');
    rainbow.addColorStop(1, 'rgba(245, 158, 11, 0.25)');
    ctx.strokeStyle = rainbow;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Wafer alignment notch
  ctx.beginPath();
  ctx.arc(0, 298, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#05070a';
  ctx.fill();
  ctx.restore();

  // Defect Comparison Card
  ctx.save();
  ctx.translate(540, 1340);
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 3;
  ctx.fillRect(-440, -150, 880, 300);
  ctx.strokeRect(-440, -150, 880, 300);

  // Dust Particle vs Transistor size comparison
  ctx.beginPath();
  ctx.arc(-260, -20, 60, 0, Math.PI * 2);
  ctx.fillStyle = '#ef4444';
  ctx.shadowColor = '#ef4444';
  ctx.shadowBlur = 25;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = '800 22px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('1 SPECK OF DUST', -260, 80);
  ctx.fillText('(10,000 nm)', -260, 110);

  // Tiny transistor dot
  ctx.beginPath();
  ctx.arc(180, -20, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#22d3ee';
  ctx.fill();

  ctx.fillStyle = '#22d3ee';
  ctx.fillText('TRANSISTOR (3 nm)', 180, 80);
  ctx.fillText('FATAL SHORT CIRCUIT', 180, 110);
  ctx.restore();
}


    window.film = {
      frame(t) {
        drawFrame(t);
      }
    };

    window.film.frame(0);
  </script>
</body>
</html>
