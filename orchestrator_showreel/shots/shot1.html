<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Scene 1: SUPERCHARGED</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; background: #07070a; font-family: 'Inter', sans-serif; }
    canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <canvas id="c" width="1920" height="1080"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 1920, H = 1080;
    
window.film = {
  frame(t) {
    const p = Math.min(Math.max(t / 3.5, 0), 1);
    ctx.fillStyle = '#07070a';
    ctx.fillRect(0, 0, W, H);

    // Laser Grid
    ctx.strokeStyle = 'rgba(237, 73, 56, 0.14)';
    ctx.lineWidth = 1;
    const spacing = 80;
    const off = (t * 120) % spacing;
    for (let x = 0; x < W; x += spacing) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = off; y < H; y += spacing) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Laser scan beam
    const ly = (t * 750) % H;
    const grad = ctx.createLinearGradient(0, ly - 30, 0, ly + 30);
    grad.addColorStop(0, 'rgba(237, 73, 56, 0)');
    grad.addColorStop(0.5, 'rgba(237, 73, 56, 0.45)');
    grad.addColorStop(1, 'rgba(237, 73, 56, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, ly - 30, W, 60);

    // Kinetic Title
    let scale = t < 0.4 ? 0.85 + 0.25 * Math.sin((t / 0.4) * Math.PI * 0.8) : 1.0 + (t - 0.4) * 0.04;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 20);
    ctx.scale(scale, scale);

    ctx.font = '900 130px "Arial Black", Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Chromatic glitch
    ctx.fillStyle = 'rgba(34, 211, 238, 0.35)';
    ctx.fillText('SUPERCHARGED', -5 * (1 - p), 0);
    ctx.fillStyle = 'rgba(237, 73, 56, 0.5)';
    ctx.fillText('SUPERCHARGED', 5 * (1 - p), 0);

    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ed4938';
    ctx.shadowBlur = 35;
    ctx.fillText('SUPERCHARGED', 0, 0);
    ctx.shadowBlur = 0;

    // Subtitle
    ctx.font = '700 24px "Courier New", monospace';
    ctx.fillStyle = '#ed4938';
    ctx.fillText('MULTI-THREADED CONCURRENT PIPELINE', 0, 100);
    ctx.restore();
  }
};

  </script>
</body>
</html>
