<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Shot 2: WRESTLEMANIA I</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #030305;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 140px 60px 180px 60px;
      z-index: 10;
    }
    .badge-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tag-badge {
      align-self: flex-start;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: #fbbf24;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }
    .scene-title {
      color: #fff;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }
    .subtitle-box {
      background: linear-gradient(180deg, rgba(5,5,8,0.7) 0%, rgba(5,5,8,0.95) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-left: 6px solid #f59e0b;
      padding: 24px 32px;
      border-radius: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.7);
    }
    .subtitle-text {
      color: #f1f5f9;
      font-size: 34px;
      line-height: 1.4;
      font-weight: 600;
    }
    .film-grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 4px 4px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="film-grain"></div>
  <div class="overlay">
    <div class="badge-wrap">
      <div class="tag-badge">*1985: THE POP CULTURE EXPLOSION*</div>
      <div class="scene-title">WRESTLEMANIA I</div>
    </div>
    <div class="subtitle-box">
      <p class="subtitle-text">Vince McMahon bet the entire company on WrestleMania, fusing sports drama with pop culture and national TV.</p>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    
function drawFrame(t) {
  ctx.fillStyle = '#040407';
  ctx.fillRect(0, 0, 1080, 1920);

  const beamAngle = Math.sin(t * 0.8) * 0.15;
  ctx.save();
  ctx.translate(540, 100);
  ctx.rotate(beamAngle);
  const spotGrad = ctx.createLinearGradient(0, 0, 0, 1500);
  spotGrad.addColorStop(0, 'rgba(251, 191, 36, 0.35)');
  spotGrad.addColorStop(0.5, 'rgba(251, 191, 36, 0.1)');
  spotGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = spotGrad;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-380, 1600);
  ctx.lineTo(380, 1600);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  const rand = sfc32(1985, 3, 31, Math.floor(t * 24));
  for (let i = 0; i < 40; i++) {
    const fx = rand() * 1080;
    const fy = 400 + rand() * 900;
    const brightness = rand();
    if (brightness > 0.65) {
      const radius = 4 + rand() * 14;
      ctx.beginPath();
      ctx.arc(fx, fy, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (rand() * 0.9) + ')';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  ctx.strokeStyle = '#dc2626';
  ctx.lineWidth = 14;
  for (let r = 0; r < 3; r++) {
    const ry = 1180 + r * 60;
    ctx.beginPath();
    ctx.moveTo(100, ry);
    ctx.lineTo(980, ry);
    ctx.stroke();
  }

  ctx.fillStyle = '#1e293b';
  ctx.fillRect(160, 1080, 50, 400);

  const beltY = 780 + Math.sin(t * 2) * 15;
  ctx.save();
  ctx.translate(540, beltY);
  ctx.scale(1.0 + t * 0.02, 1.0 + t * 0.02);

  ctx.fillStyle = '#f59e0b';
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 40;
  ctx.beginPath();
  ctx.ellipse(0, 0, 140, 85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = '#78350f';
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.fillStyle = '#78350f';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('WORLD CHAMPION', 0, 8);
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '800 36px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('MADISON SQUARE GARDEN • MARCH 31, 1985', 540, 500);
}


    window.film = {
      frame(t) {
        drawFrame(t);
      }
    };

    window.film.frame(0);
  </script>
</body>
</html>
