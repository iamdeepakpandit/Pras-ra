<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Shot 5: AN UNSTOPPABLE EMPIRE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #030305;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 140px 60px 180px 60px;
      z-index: 10;
    }
    .badge-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tag-badge {
      align-self: flex-start;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: #fbbf24;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
    }
    .scene-title {
      color: #fff;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.8);
    }
    .subtitle-box {
      background: linear-gradient(180deg, rgba(5,5,8,0.7) 0%, rgba(5,5,8,0.95) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-left: 6px solid #f59e0b;
      padding: 24px 32px;
      border-radius: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.7);
    }
    .subtitle-text {
      color: #f1f5f9;
      font-size: 34px;
      line-height: 1.4;
      font-weight: 600;
    }
    .film-grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 4px 4px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div class="film-grain"></div>
  <div class="overlay">
    <div class="badge-wrap">
      <div class="tag-badge">*GLOBAL POWERHOUSE*</div>
      <div class="scene-title">AN UNSTOPPABLE EMPIRE</div>
    </div>
    <div class="subtitle-box">
      <p class="subtitle-text">Today, as a multi-billion dollar empire, WWE is an unstoppable global powerhouse.</p>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');

    function sfc32(a, b, c, d) {
      return function() {
        a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
        var t = (a + b | 0) + d | 0;
        d = d + 1 | 0;
        a = b ^ b >>> 9;
        b = c + (c << 3) | 0;
        c = (c << 21 | c >>> 11);
        c = c + t | 0;
        return (t >>> 0) / 4294967296;
      }
    }

    
function drawFrame(t) {
  ctx.fillStyle = '#040508';
  ctx.fillRect(0, 0, 1080, 1920);

  const auraGrad = ctx.createRadialGradient(540, 960, 150, 540, 960, 520);
  auraGrad.addColorStop(0, 'rgba(245, 158, 11, 0.25)');
  auraGrad.addColorStop(0.7, 'rgba(180, 83, 9, 0.08)');
  auraGrad.addColorStop(1, 'rgba(4, 5, 8, 0)');
  ctx.fillStyle = auraGrad;
  ctx.fillRect(0, 0, 1080, 1920);

  ctx.save();
  ctx.translate(540, 920);
  const rot = Math.sin(t * 0.8) * 0.04;
  ctx.rotate(rot);

  ctx.beginPath();
  ctx.arc(0, 0, 260, 0, Math.PI * 2);
  const goldGrad = ctx.createLinearGradient(-260, -260, 260, 260);
  goldGrad.addColorStop(0, '#fef08a');
  goldGrad.addColorStop(0.3, '#f59e0b');
  goldGrad.addColorStop(0.7, '#b45309');
  goldGrad.addColorStop(1, '#fef08a');
  ctx.fillStyle = goldGrad;
  ctx.shadowColor = '#fbbf24';
  ctx.shadowBlur = 50;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.arc(0, 0, 220, 0, Math.PI * 2);
  ctx.fillStyle = '#0f172a';
  ctx.fill();
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 8;
  ctx.stroke();

  ctx.fillStyle = '#fbbf24';
  ctx.font = '900 110px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('WWE', 0, 40);

  ctx.font = '800 24px sans-serif';
  ctx.fillStyle = '#e2e8f0';
  ctx.fillText('UNDISPUTED CHAMPION', 0, 100);

  ctx.restore();

  const sheenX = ((t * 600) % 2400) - 600;
  ctx.save();
  ctx.beginPath();
  ctx.rect(200, 600, 680, 680);
  ctx.clip();

  const sheenGrad = ctx.createLinearGradient(sheenX, 600, sheenX + 250, 1300);
  sheenGrad.addColorStop(0, 'rgba(255,255,255,0)');
  sheenGrad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
  sheenGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheenGrad;
  ctx.fillRect(sheenX - 200, 600, 600, 700);
  ctx.restore();

  ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 3;
  ctx.fillRect(240, 1340, 600, 100);
  ctx.strokeRect(240, 1340, 600, 100);

  ctx.fillStyle = '#fbbf24';
  ctx.font = '900 46px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('$21+ BILLION TKO', 540, 1405);
}


    window.film = {
      frame(t) {
        drawFrame(t);
      }
    };

    window.film.frame(0);
  </script>
</body>
</html>
